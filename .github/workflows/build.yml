name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PS4 ELF
    runs-on: ubuntu-24.04
    env:
      PS4_PAYLOAD_SDK: /opt/ps4-payload-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld unzip

      - name: Download PS4 payload SDK v0.9
        run: |
          curl -fL -o /tmp/ps4-payload-sdk.zip \
            https://github.com/ps4-payload-dev/sdk/releases/download/v0.9/ps4-payload-sdk.zip
          sudo rm -rf "$PS4_PAYLOAD_SDK"
          sudo unzip -q /tmp/ps4-payload-sdk.zip -d /opt

      - name: Build
        run: |
          make -j"$(nproc)"
          ls -l ps5-bridge.elf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps5-bridge-elf
          path: ps5-bridge.elf
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ps5-bridge.elf
